<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nicholas Balasus</title>

    <style>
        body {
            margin: 0;
            padding: 80px 20px 60px;
            background: #fff;
            color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }

        .content {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.6px;
        }

        .profile-photo {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin-bottom: 20px;
            object-fit: cover;
        }

        .bio {
            margin: 0 0 15px;
            font-size: 16px;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            margin-bottom: 30px;
        }

        .links a {
            color: #555;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: -0.2px;
            text-decoration: none;
        }

        .links a:hover {
            color: #111;
            text-decoration: underline;
        }

        .links a:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 4px;
        }

        footer {
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="content">
        <header>
            <h1>Nicholas Balasus</h1>
        </header>

        <img
            class="profile-photo"
            src="photo.jpg"
            alt="Photo of Nicholas Balasus"
        >

        <p class="bio">
            I am a Postdoctoral Scholar at Carbon Mapper. My research focuses on
            the remote sensing of greenhouse gases and air pollutants, including
            methane, nitrous oxide, and ammonia.
        </p>

        <nav class="links" aria-label="Professional links">
            <a
                href="https://scholar.google.com/citations?user=_VsfgFYAAAAJ&amp;hl=en"
                target="_blank"
                rel="noopener noreferrer"
            >Google Scholar</a>
            <a
                href="https://nicholasbalasus.github.io/cv.pdf"
                target="_blank"
                rel="noopener noreferrer"
            >CV</a>
        </nav>

        <footer>
            <p>
                Last updated:
                <time datetime="2026-10-30">30 October 2026</time>
            </p>
        </footer>
    </main>
</body>
</html>
